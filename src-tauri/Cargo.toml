[package]
name = "rusty-cleaner-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
open = "5"
rusty-cleaner = { path = ".." }
serde = { version = "1", features = ["derive"] }
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk"] }
tauri = { version = "2", features = [] }
trash = "5"
