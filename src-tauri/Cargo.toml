[package]
name = "rusty-cleaner-desktop"
version = "0.3.1"
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
open = "5"
rusty-cleaner = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2.0.0-beta.0"
trash = "5"
