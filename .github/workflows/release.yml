name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: macos
            os: macos-latest
            target: x86_64-apple-darwin
          - platform: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Build frontend
        env:
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          npm ci
          npm run build
      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --target ${{ matrix.target }}
      - name: Sign Windows binaries
        if: matrix.platform == 'windows' && env.SIGNPATH_API_TOKEN != ''
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORG_ID: ${{ secrets.SIGNPATH_ORG_ID }}
        run: |
          npm install -g @signpath/cli
          signpath sign --api-token "$SIGNPATH_API_TOKEN" --organization-id "$SIGNPATH_ORG_ID" --project "rusty-cleaner" --artifact-configuration "windows" --input-artifact "target/${{ matrix.target }}/release/bundle/msi/*.msi" --output-artifact "target/${{ matrix.target }}/release/bundle/msi/"
          signpath sign --api-token "$SIGNPATH_API_TOKEN" --organization-id "$SIGNPATH_ORG_ID" --project "rusty-cleaner" --artifact-configuration "windows" --input-artifact "target/${{ matrix.target }}/release/bundle/nsis/*.exe" --output-artifact "target/${{ matrix.target }}/release/bundle/nsis/"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rusty-cleaner-${{ matrix.platform }}
          path: |
            target/${{ matrix.target }}/release/bundle/**/*.deb
            target/${{ matrix.target }}/release/bundle/**/*.AppImage
            target/${{ matrix.target }}/release/bundle/**/*.rpm
            target/${{ matrix.target }}/release/bundle/**/*.dmg
            target/${{ matrix.target }}/release/bundle/**/*.msi
            target/${{ matrix.target }}/release/bundle/**/*.exe
            target/${{ matrix.target }}/release/bundle/**/*.sig
            target/${{ matrix.target }}/release/bundle/**/*.AppImage.tar.gz
            target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz
          if-no-files-found: warn

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: rusty-cleaner-*
          path: artifacts
      - name: Collect curated release notes
        id: notes
        run: |
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            echo "path=$notes" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.rpm
            artifacts/**/*.dmg
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.sig
            artifacts/**/*.AppImage.tar.gz
            artifacts/**/*.app.tar.gz
          generate_release_notes: true

      - name: Generate updater manifest (latest.json)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"
          VERSION="${TAG#v}"
          python3 - "$TAG" "$REPO" "$VERSION" <<'EOF'
          import json, os, sys, urllib.request

          tag, repo, version = sys.argv[1], sys.argv[2], sys.argv[3]
          token = os.environ["GH_TOKEN"]
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/releases/tags/{tag}",
              headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"},
          )
          release = json.load(urllib.request.urlopen(req))
          assets = {a["name"]: a["browser_download_url"] for a in release["assets"]}

          def find(suffix):
              for name, url in assets.items():
                  if name.endswith(suffix):
                      return name, url
              return None, None

          platforms = {}
          mapping = {
              # Tauri v2 signs the AppImage in place; macOS ships an .app
              # tarball and Windows the NSIS setup binary.
              "linux-x86_64": (".AppImage", ".AppImage.sig"),
              "darwin-x86_64": (".app.tar.gz", ".app.tar.gz.sig"),
              "windows-x86_64": ("-setup.exe", "-setup.exe.sig"),
          }
          for platform, (bundle_suffix, sig_suffix) in mapping.items():
              bundle_name, bundle_url = find(bundle_suffix)
              sig_name, sig_url = find(sig_suffix)
              if not bundle_url or not sig_url:
                  continue
              sig_req = urllib.request.Request(sig_url, headers={"Authorization": f"Bearer {token}"})
              signature = urllib.request.urlopen(sig_req).read().decode().strip()
              platforms[platform] = {"signature": signature, "url": bundle_url}

          manifest = {
              "version": version,
              "notes": f"https://github.com/{repo}/releases/tag/{tag}",
              "pub_date": release["published_at"],
              "platforms": platforms,
          }
          with open("latest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest, indent=2))
          EOF

      - name: Upload updater manifest
        uses: softprops/action-gh-release@v2
        with:
          files: latest.json
